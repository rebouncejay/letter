<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Brenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f7dde2;
    --blush-soft: #fdf3f5;
    --white: #ffffff;
    --dusty-blue: #a9c3d6;
    --deep-rose: #b96b7f;
    --charcoal: #4a4048;
    --charcoal-soft: #6b5f66;
    --gold-hint: #d8b7a3;
    --crimson: #b8264a;
    --crimson-deep: #9c1f3f;
    --envelope-pink: #f1d3d9;
    --envelope-flap-pink: #e6bcc4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--crimson) 0%, var(--crimson-deep) 100%);
    font-family: 'EB Garamond', serif;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 620px;
    position: relative;
  }

  /* ---------- ENVELOPE ---------- */
  .envelope-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    position: absolute;
    inset: 0;
  }

  .envelope {
    position: relative;
    width: 300px;
    height: 200px;
    cursor: pointer;
    filter: drop-shadow(0 18px 30px rgba(40, 5, 15, 0.35));
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    background: var(--envelope-pink);
    border: 1px solid var(--envelope-flap-pink);
    border-radius: 4px;
  }

  .envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 110px solid var(--envelope-flap-pink);
    transform-origin: top;
    transition: transform 0.6s cubic-bezier(.6,.1,.3,1);
    z-index: 3;
  }

  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
  }

  .envelope-shadow-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 110px solid rgba(0, 0, 0, 0.12);
    opacity: 0.4;
    z-index: 1;
  }

  .envelope-seal {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px dashed rgba(154, 60, 90, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(154, 60, 90, 0.55);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    z-index: 4;
    box-shadow: none;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  .envelope.open .envelope-seal {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }

  .envelope-letter-peek {
    position: absolute;
    bottom: 6px;
    left: 8px;
    right: 8px;
    height: 60%;
    background: var(--white);
    border-radius: 2px;
    z-index: 2;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.06);
  }

  .prompt-text {
    margin-top: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .prompt-name {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: normal;
    font-weight: 600;
    font-size: 34px;
    color: var(--white);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  /* ---------- LETTER ---------- */
  .letter-wrap {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
    position: relative;
  }

  .letter-wrap.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .letter-card {
    background: var(--white);
    border-radius: 6px;
    padding: 56px 48px 48px;
    box-shadow: 0 30px 60px rgba(90, 60, 70, 0.16);
    border: 1px solid var(--blush);
    position: relative;
  }

  .letter-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--dusty-blue), var(--blush), var(--deep-rose));
    border-radius: 6px 6px 0 0;
  }

  .letter-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--deep-rose);
    margin-bottom: 28px;
  }

  .letter-body {
    font-size: 19px;
    line-height: 1.85;
    color: var(--charcoal);
    white-space: pre-wrap;
  }

  .letter-body .line {
    opacity: 0;
    display: block;
    animation: fadeInLine 1s ease forwards;
  }

  @keyframes fadeInLine {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .letter-signoff {
    margin-top: 36px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--charcoal-soft);
    opacity: 0;
    animation: fadeInLine 1s ease forwards;
  }

  /* ---------- FLOATING POLAROIDS ---------- */
  .polaroids {
    position: absolute;
    inset: -60px -90px;
    pointer-events: none;
    z-index: -1;
  }

  .polaroid {
    position: absolute;
    background: var(--white);
    padding: 10px 10px 34px;
    border-radius: 3px;
    box-shadow: 0 14px 26px rgba(90, 60, 70, 0.22);
    width: 150px;
    opacity: 0;
    animation: polaroidIn 1s ease forwards, floatDrift 6s ease-in-out infinite;
    pointer-events: auto;
  }

  .polaroid img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--blush), var(--dusty-blue));
    border-radius: 1px;
  }

  .polaroid-caption {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--charcoal-soft);
  }

  @keyframes polaroidIn {
    from { opacity: 0; transform: translateY(16px) scale(0.9) rotate(var(--rot)); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }
  }

  @keyframes floatDrift {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-10px) rotate(calc(var(--rot) - 1.5deg)); }
  }

  .polaroid:nth-child(1) { --rot: -8deg; top: -40px; left: -70px; animation-delay: 3.2s, 3.2s; }
  .polaroid:nth-child(2) { --rot: 6deg;  top: 60px;  right: -90px; animation-delay: 3.6s, 3.6s; width: 135px; }
  .polaroid:nth-child(3) { --rot: 5deg;  bottom: -30px; left: -60px; animation-delay: 4.0s, 4.0s; width: 130px; }
  .polaroid:nth-child(4) { --rot: -6deg; bottom: 40px; right: -70px; animation-delay: 4.4s, 4.4s; width: 125px; }
  .polaroid:nth-child(5) { --rot: 4deg;  top: 260px; left: -95px; animation-delay: 4.8s, 4.8s; width: 130px; }

  @media (max-width: 900px) {
    .polaroids { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .letter-body .line, .letter-signoff, .polaroid {
      animation: none;
      opacity: 1;
    }
    .envelope-flap, .envelope-seal, .envelope-wrap, .letter-wrap {
      transition: none;
    }
  }

  @media (max-width: 480px) {
    .envelope { width: 250px; height: 170px; }
    .envelope-flap, .envelope-shadow-flap { border-left-width: 125px; border-right-width: 125px; border-top-width: 92px; }
    .letter-card { padding: 40px 26px 34px; }
    .letter-heading { font-size: 25px; }
    .letter-body { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the letter">
      <div class="envelope-shadow-flap"></div>
      <div class="envelope-letter-peek"></div>
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
      <div class="envelope-seal">B</div>
    </div>
    <p class="prompt-text">
      <span class="prompt-name">Brenda</span>
      there's something I need to say to you.
    </p>
  </div>

  <div class="letter-wrap" id="letterWrap">
    <div class="polaroids" id="polaroids">
      <!--
        Each polaroid below is a placeholder.
        Replace src="" with your real photo (a file path, URL, or base64 data URI).
        Edit or remove the caption text as you like.
      -->
      <div class="polaroid">
        <img src="photos/polaroid1.jpeg" alt="us, close" style="object-position: center 30%;">
        <div class="polaroid-caption">us :)</div>
      </div>
      <div class="polaroid">
        <img src="photos/polaroid2.jpeg" alt="us, in the car" style="object-position: center 35%;">
        <div class="polaroid-caption">that day</div>
      </div>
      <div class="polaroid">
        <img src="photos/polaroid3.jpeg" alt="us, together">
        <div class="polaroid-caption">favorite one</div>
      </div>
      <div class="polaroid">
        <img src="photos/polaroid4.jpeg" alt="us, on the bus" style="object-position: center 30%;">
        <div class="polaroid-caption">so much laughter</div>
      </div>
      <div class="polaroid">
        <img src="photos/polaroid5.jpeg" alt="us, out together" style="object-position: center 25%;">
        <div class="polaroid-caption">good night</div>
      </div>
    </div>
    <div class="letter-card">
      <div class="letter-heading">Dear Brenda,</div>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-signoff" id="signoff" style="animation-delay: 2.4s;">— with all my love, Senior</p>
    </div>
  </div>

</div>

<script>
  const envelope = document.getElementById('envelope');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const letterWrap = document.getElementById('letterWrap');
  const letterBody = document.getElementById('letterBody');

  // Placeholder letter — swap this array out with the real message later.
  // Each string in the array becomes its own fading-in line/paragraph.
  const letterLines = [
    "I've been meaning to write this for a while, and I don't want to get it wrong.",
    "I'm sorry. Truly, deeply sorry — for the hurt I caused and for not seeing it sooner.",
    "You deserve better than that, and I know saying it here doesn't undo it.",
    "But I wanted you to have these words, in a place you can come back to whenever you need them.",
    "Thank you for your patience with me. I hope we can move forward from here, together."
  ];

  function typeInLetter() {
    letterBody.innerHTML = '';
    letterLines.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'line';
      span.textContent = text;
      span.style.animationDelay = (i * 0.55) + 's';
      span.style.marginBottom = '18px';
      letterBody.appendChild(span);
    });
    const signoffDelay = (letterLines.length * 0.55) + 0.3;
    document.getElementById('signoff').style.animationDelay = signoffDelay + 's';

    // Polaroids drift in shortly after the last line finishes
    const polaroids = document.querySelectorAll('.polaroid');
    const baseDelay = signoffDelay + 0.6;
    polaroids.forEach((p, i) => {
      const inDelay = baseDelay + i * 0.35;
      p.style.animationDelay = inDelay + 's, ' + inDelay + 's';
    });
  }

  function openLetter() {
    envelope.classList.add('open');
    typeInLetter();
    setTimeout(() => {
      envelopeWrap.classList.add('hidden');
      letterWrap.classList.add('visible');
    }, 650);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' || e.key === ' ') openLetter();
  });
</script>

</body>
</html>

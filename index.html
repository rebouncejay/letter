<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Brenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f6d3de;
    --blush-soft: #fdf1f5;
    --white: #ffffff;
    --rose-mid: #e896b4;
    --deep-rose: #c9587f;
    --deep-rose-2: #a8436a;
    --charcoal: #4a3540;
    --charcoal-soft: #75596a;
    --gold-hint: #d8b7a3;
    --bg-top: #f9e2ea;
    --bg-bottom: #eeb8cd;
    --cream: #f8ecd9;
    --wax-light: #f0d9a0;
    --wax-mid: #caa155;
    --wax-dark: #7c5a25;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: 'EB Garamond', serif;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 620px;
    position: relative;
  }

  /* ---------- LANDING (postcard) ---------- */
  .landing-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    overflow: hidden;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .landing-wrap.hidden {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    position: absolute;
    inset: 0;
  }

  /* ambient bokeh + petals behind the postcard */
  .ambient-bg {
    position: absolute;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
  }

  .bokeh {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.9), rgba(233,150,180,0.35) 55%, transparent 75%);
    animation: bokehFloat ease-in-out infinite;
  }

  .bokeh:nth-child(1) { width: 70px; height: 70px; top: 8%; left: 10%; animation-duration: 9s; }
  .bokeh:nth-child(2) { width: 34px; height: 34px; top: 14%; left: 78%; animation-duration: 7s; animation-delay: .6s; }
  .bokeh:nth-child(3) { width: 50px; height: 50px; top: 78%; left: 6%; animation-duration: 10s; animation-delay: 1.2s; }
  .bokeh:nth-child(4) { width: 26px; height: 26px; top: 82%; left: 86%; animation-duration: 6.5s; animation-delay: .3s; }
  .bokeh:nth-child(5) { width: 44px; height: 44px; top: 4%; left: 46%; animation-duration: 8s; animation-delay: 1.6s; }
  .bokeh:nth-child(6) { width: 20px; height: 20px; top: 90%; left: 45%; animation-duration: 7.5s; animation-delay: .9s; }

  @keyframes bokehFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
    50% { transform: translateY(-22px) scale(1.08); opacity: 0.85; }
  }

  .petal {
    position: absolute;
    top: -8%;
    width: 12px;
    height: 16px;
    background: var(--rose-mid);
    border-radius: 0 100% 0 100%;
    opacity: 0;
    animation: petalFall linear infinite;
  }

  .petal:nth-child(8) { left: 18%; animation-duration: 11s; animation-delay: 0s; }
  .petal:nth-child(9) { left: 40%; background: var(--deep-rose); animation-duration: 13s; animation-delay: 3s; }
  .petal:nth-child(10) { left: 64%; animation-duration: 12s; animation-delay: 6s; }
  .petal:nth-child(11) { left: 84%; background: var(--deep-rose); animation-duration: 10s; animation-delay: 1.5s; }

  @keyframes petalFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: 0.65; }
    90% { opacity: 0.5; }
    100% { transform: translateY(115%) translateX(24px) rotate(220deg); opacity: 0; }
  }

  /* ---------- POSTCARD ---------- */
  .postcard {
    position: relative;
    z-index: 1;
    width: min(520px, 92vw);
    aspect-ratio: 4 / 3;
    background: linear-gradient(155deg, var(--deep-rose) 0%, var(--deep-rose-2) 100%);
    border-radius: 10px;
    box-shadow: 0 25px 55px rgba(120, 40, 70, 0.35);
    overflow: hidden;
    padding: 40px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
    transform-origin: center;
  }

  .postcard-vine {
    position: absolute;
    left: 0;
    right: 0;
    height: 54px;
    opacity: 0.9;
  }

  .postcard-vine.top { top: 0; }
  .postcard-vine.bottom { bottom: 0; transform: rotate(180deg); }

  .postcard-bouquet {
    width: 100px;
    flex-shrink: 0;
    animation: bouquetSway 5s ease-in-out infinite;
    transform-origin: bottom center;
    position: relative;
    z-index: 1;
  }

  @keyframes bouquetSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  .postcard-text {
    text-align: right;
    position: relative;
    z-index: 1;
  }

  .postcard-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--cream);
    margin-bottom: 10px;
  }

  .postcard-quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 25px;
    line-height: 1.35;
    color: var(--white);
  }

  .postcard-stamp {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-light) 0%, var(--wax-mid) 48%, var(--wax-dark) 85%, #6b4c1f 100%);
    border: 1px solid rgba(107, 76, 31, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a3210;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 3px 7px rgba(70,40,10,0.4), inset 0 -3px 4px rgba(60,35,10,0.35), inset 0 2px 4px rgba(255,235,180,0.5);
    pointer-events: none;
    z-index: 1;
  }

  .tap-hint {
    margin-top: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--charcoal-soft);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* fold animation */
  .postcard.folding {
    animation: foldPaper 0.7s cubic-bezier(.5,0,.6,1) forwards;
  }

  @keyframes foldPaper {
    0%   { transform: scaleY(1) scaleX(1) rotate(0deg); opacity: 1; }
    30%  { transform: scaleY(0.55) scaleX(1) rotate(0deg); }
    55%  { transform: scaleY(0.55) scaleX(0.45) rotate(4deg); }
    80%  { transform: scaleY(0.2) scaleX(0.3) rotate(-6deg); }
    100% { transform: scaleY(0.12) scaleX(0.24) rotate(0deg); opacity: 0.85; }
  }

  /* paper plane */
  .paper-plane {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
  }

  .paper-plane svg {
    width: 70px;
    height: 70px;
    filter: drop-shadow(0 10px 16px rgba(120,40,70,0.35));
  }

  .paper-plane.flying {
    animation: flyAway 1s cubic-bezier(.3,.2,.5,1) forwards;
  }

  @keyframes flyAway {
    0%   { opacity: 1; transform: translate(0,0) rotate(-8deg) scale(1); }
    25%  { opacity: 1; transform: translate(40px,-30px) rotate(6deg) scale(1.02); }
    100% { opacity: 0; transform: translate(320px,-260px) rotate(32deg) scale(0.4); }
  }

  @media (max-width: 560px) {
    .postcard { flex-direction: column; text-align: center; padding: 34px 20px; justify-content: center; gap: 10px; }
    .postcard-text { text-align: center; }
    .postcard-bouquet { width: 84px; }
    .postcard-quote { font-size: 21px; }
  }

  /* ---------- LETTER PAGES ---------- */
  .page {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
    position: relative;
  }

  .page.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .page.leaving {
    opacity: 0;
    transform: translateY(-18px);
  }

  .letter-card {
    background: var(--white);
    border-radius: 6px;
    padding: 56px 48px 48px;
    box-shadow: 0 30px 60px rgba(90, 60, 70, 0.16);
    border: 1px solid var(--blush);
    position: relative;
  }

  .letter-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--rose-mid), var(--blush), var(--deep-rose));
    border-radius: 6px 6px 0 0;
  }

  .letter-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--deep-rose);
    margin-bottom: 28px;
  }

  .letter-body {
    font-size: 19px;
    line-height: 1.85;
    color: var(--charcoal);
    white-space: pre-wrap;
  }

  .letter-body .line {
    opacity: 0;
    display: block;
    animation: fadeInLine 1s ease forwards;
  }

  @keyframes fadeInLine {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .letter-signoff {
    margin-top: 36px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--charcoal-soft);
    opacity: 0;
    animation: fadeInLine 1s ease forwards;
  }

  .continue-prompt {
    display: block;
    margin: 40px auto 0;
    background: none;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--deep-rose);
    cursor: pointer;
    opacity: 0;
    animation: fadeInLine 1s ease forwards;
    text-align: center;
    letter-spacing: 0.02em;
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .continue-prompt:hover {
    transform: translateY(2px);
    color: var(--charcoal);
  }

  .continue-prompt .arrow {
    display: inline-block;
    margin-left: 6px;
    transition: transform 0.25s ease;
  }

  .continue-prompt:hover .arrow {
    transform: translateX(4px);
  }

  .more-photos-note {
    margin-top: 36px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .photo-placeholder {
    width: 70px;
    height: 70px;
    border-radius: 4px;
    border: 1.5px dashed var(--blush);
    background: var(--blush-soft);
  }

  /* ---------- FLOATING POLAROIDS ---------- */
  .polaroids {
    position: absolute;
    inset: -60px -90px;
    pointer-events: none;
    z-index: -1;
  }

  .polaroid {
    position: absolute;
    background: var(--white);
    padding: 10px 10px 34px;
    border-radius: 3px;
    box-shadow: 0 14px 26px rgba(90, 60, 70, 0.22);
    width: 150px;
    opacity: 0;
    animation: polaroidIn 1.1s cubic-bezier(.2,.9,.3,1.15) forwards, floatDrift 6s ease-in-out infinite;
    pointer-events: auto;
  }

  .polaroid img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--blush), var(--rose-mid));
    border-radius: 1px;
  }

  .polaroid-caption {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--charcoal-soft);
  }

  @keyframes polaroidIn {
    0%   { opacity: 0; transform: translateY(55px) scale(0.7) rotate(calc(var(--rot) * 2.2)); }
    65%  { opacity: 1; transform: translateY(-7px) scale(1.04) rotate(calc(var(--rot) - 2deg)); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }
  }

  @keyframes floatDrift {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-10px) rotate(calc(var(--rot) - 1.5deg)); }
  }

  .polaroid:nth-child(1) { --rot: -8deg; top: -40px; left: -70px; animation-delay: 3.2s, 3.2s; }
  .polaroid:nth-child(2) { --rot: 6deg;  top: 60px;  right: -90px; animation-delay: 3.6s, 3.6s; width: 135px; }
  .polaroid:nth-child(3) { --rot: 5deg;  bottom: -30px; left: -60px; animation-delay: 4.0s, 4.0s; width: 130px; }
  .polaroid:nth-child(4) { --rot: -6deg; bottom: 40px; right: -70px; animation-delay: 4.4s, 4.4s; width: 125px; }
  .polaroid:nth-child(5) { --rot: 4deg;  top: 260px; left: -95px; animation-delay: 4.8s, 4.8s; width: 130px; }

  @media (max-width: 900px) {
    .polaroids { display: none; }
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--white);
    border: 1px solid var(--blush);
    box-shadow: 0 8px 20px rgba(90, 60, 70, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 20;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .music-toggle.shown {
    opacity: 1;
    transform: scale(1);
  }

  .music-toggle .bar {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }

  .music-toggle .bar span {
    width: 3px;
    background: var(--deep-rose);
    border-radius: 2px;
    animation: barBounce 0.9s ease-in-out infinite;
  }

  .music-toggle .bar span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .music-toggle .bar span:nth-child(2) { height: 100%; animation-delay: .15s; }
  .music-toggle .bar span:nth-child(3) { height: 65%; animation-delay: .3s; }

  .music-toggle.paused .bar span {
    animation-play-state: paused;
    height: 30% !important;
  }

  @keyframes barBounce {
    0%, 100% { height: 30%; }
    50% { height: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .letter-body .line, .letter-signoff, .polaroid, .continue-prompt {
      animation: none;
      opacity: 1;
    }
    .page {
      transition: none;
    }
    .bokeh, .petal, .postcard-bouquet, .music-toggle .bar span {
      animation: none;
      opacity: 0.4;
    }
    .postcard.folding, .paper-plane.flying {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    .letter-card { padding: 40px 26px 34px; }
    .letter-heading { font-size: 25px; }
    .letter-body { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="landing-wrap" id="landingWrap">
    <div class="ambient-bg" aria-hidden="true">
      <div class="bokeh"></div>
      <div class="bokeh"></div>
      <div class="bokeh"></div>
      <div class="bokeh"></div>
      <div class="bokeh"></div>
      <div class="bokeh"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>

    <div class="postcard" id="postcard" role="button" tabindex="0" aria-label="Send the card">
      <svg class="postcard-vine top" viewBox="0 0 480 54" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0,10 C60,26 120,-4 180,10 C240,24 300,-2 360,10 C410,20 450,4 480,10" stroke="var(--cream)" stroke-width="1.5" fill="none" opacity="0.8"/>

          <ellipse cx="140" cy="4" rx="7" ry="3" transform="rotate(-15 140 4)"/>

          <ellipse cx="220" cy="4" rx="7" ry="3" transform="rotate(-20 220 4)"/>

          <ellipse cx="420" cy="14" rx="7" ry="3" transform="rotate(25 420 14)"/>
          <ellipse cx="455" cy="6" rx="7" ry="3" transform="rotate(-15 455 6)"/>
          <circle cx="48" cy="10" r="2"/>

        </g>
      </svg>

      <svg class="postcard-bouquet" viewBox="0 0 160 175" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M80 140 L55 175 M80 140 L80 178 M80 140 L105 175" stroke="#7a9169" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="48" cy="118" rx="20" ry="8" fill="#7a9169" transform="rotate(-35 48 118)"/>
        <ellipse cx="115" cy="112" rx="20" ry="8" fill="#688058" transform="rotate(30 115 112)"/>

        <line x1="94" y1="138" x2="118" y2="150" stroke="#b98f5e" stroke-width="1.5"/>
        <g transform="translate(112,146) rotate(18)">
          <rect x="0" y="0" width="34" height="22" rx="3" fill="#cba573" stroke="#a9855a" stroke-width="1"/>
          <circle cx="6" cy="5" r="1.6" fill="#7c5a25"/>
          <text x="17" y="14" font-family="Cormorant Garamond, serif" font-style="italic" font-size="8" fill="#4a3210" text-anchor="middle">I'm sorry</text>
        </g>
        <g transform="translate(45,55)">
          <circle r="19" fill="#fbeef1"/>
          <circle r="13" fill="#ffffff"/>
          <circle r="7" fill="#f7dde5"/>
        </g>
        <g transform="translate(108,50)">
          <circle r="18" fill="#e6b9c9"/>
          <path d="M0,0 m-12,0 a12,12 0 1,1 24,0 a9,9 0 1,0 -18,0 a6,6 0 1,1 12,0" fill="none" stroke="#c9587f" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g transform="translate(78,88)">
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(0)"/>
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(60)"/>
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(120)"/>
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(180)"/>
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(240)"/>
          <ellipse rx="7" ry="11" fill="#f2d24b" transform="rotate(300)"/>

        </g>
        <circle cx="30" cy="80" r="4" fill="#f2d24b"/>
        <circle cx="125" cy="78" r="4" fill="#f2d24b"/>
        <circle cx="95" cy="60" r="3.5" fill="#e896b4"/>
        <circle cx="60" cy="68" r="3.5" fill="#f2d24b"/>
      </svg>

      <div class="postcard-text">
        <div class="postcard-name">Brenda,</div>
        <div class="postcard-quote">There are no words<br>for how sorry<br>I am.</div>
      </div>

      <div class="postcard-stamp">B</div>

      <svg class="postcard-vine bottom" viewBox="0 0 480 54" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0,10 C60,26 120,-4 180,10 C240,24 300,-2 360,10 C410,20 450,4 480,10" stroke="var(--cream)" stroke-width="1.5" fill="none" opacity="0.8"/>
        <g fill="var(--cream)">
          <ellipse cx="30" cy="14" rx="7" ry="3" transform="rotate(20 30 14)"/>
          <ellipse cx="65" cy="6" rx="7" ry="3" transform="rotate(-25 65 6)"/>
          <ellipse cx="100" cy="16" rx="7" ry="3" transform="rotate(30 100 16)"/>
          <ellipse cx="140" cy="4" rx="7" ry="3" transform="rotate(-15 140 4)"/>
          <ellipse cx="180" cy="14" rx="7" ry="3" transform="rotate(25 180 14)"/>
          <ellipse cx="220" cy="4" rx="7" ry="3" transform="rotate(-20 220 4)"/>
          <ellipse cx="260" cy="15" rx="7" ry="3" transform="rotate(20 260 15)"/>

<!--
  Background music: pointing at audio/butterflies.mp3.
  I can't embed the actual song file myself — copyrighted audio can't be reproduced here.
  Add your own legally obtained copy of the track as audio/butterflies.mp3 in a folder
  next to this HTML file (same idea as the photos folder) and the toggle below will play it.
-->
<audio id="bgAudio" src="audio/butterflies.mp3" loop preload="none"></audio>
<button class="music-toggle paused" id="musicToggle" type="button" aria-label="Play music">
  <span class="bar"><span></span><span></span><span></span></span>
</button>

<script>
  const postcard = document.getElementById('postcard');
  const paperPlane = document.getElementById('paperPlane');
  const landingWrap = document.getElementById('landingWrap');
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const letterBody = document.getElementById('letterBody');
  const continueBtn = document.getElementById('continueBtn');
  const musicToggle = document.getElementById('musicToggle');
  const bgAudio = document.getElementById('bgAudio');

  // Placeholder letter — swap this array out with the real message later.
  const letterLines = [
    "I've been meaning to write this for a while, and I don't want to get it wrong.",
    "I'm sorry. Truly, deeply sorry — for the hurt I caused and for not seeing it sooner.",
    "You deserve better than that, and I know saying it here doesn't undo it.",
    "But I wanted you to have these words, in a place you can come back to whenever you need them.",
    "Thank you for your patience with me. I hope we can move forward from here, together."
  ];

  function typeInLetter() {
    letterBody.innerHTML = '';
    letterLines.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'line';
      span.textContent = text;
      span.style.animationDelay = (i * 0.55) + 's';
      span.style.marginBottom = '18px';
      letterBody.appendChild(span);
    });
    const continueDelay = (letterLines.length * 0.55) + 0.4;
    continueBtn.style.animationDelay = continueDelay + 's';

    const polaroids = document.querySelectorAll('.polaroid');
    const baseDelay = continueDelay + 0.6;
    polaroids.forEach((p, i) => {
      const inDelay = baseDelay + i * 0.35;
      p.style.animationDelay = inDelay + 's, ' + inDelay + 's';
    });
  }

  function sendCard() {
    postcard.classList.add('folding');
    setTimeout(() => {
      postcard.style.display = 'none';
      paperPlane.classList.add('flying');
      typeInLetter();
    }, 700);

    setTimeout(() => {
      landingWrap.classList.add('hidden');
      page1.classList.add('visible');
      musicToggle.classList.add('shown');
    }, 700 + 950);
  }

  function goToPage2() {
    page1.classList.add('leaving');
    setTimeout(() => {
      page1.classList.remove('visible');
      page1.classList.remove('leaving');
      page2.classList.add('visible');
    }, 500);
  }

  postcard.addEventListener('click', sendCard);
  postcard.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' || e.key === ' ') sendCard();
  });

  continueBtn.addEventListener('click', goToPage2);

  musicToggle.addEventListener('click', () => {
    if (bgAudio.paused) {
      bgAudio.play().catch(() => {
        // File not present yet (audio/butterflies.mp3 hasn't been added) — fail quietly.
      });
      musicToggle.classList.remove('paused');
      musicToggle.setAttribute('aria-label', 'Pause music');
    } else {
      bgAudio.pause();
      musicToggle.classList.add('paused');
      musicToggle.setAttribute('aria-label', 'Play music');
    }
  });
</script>

</body>
</html>

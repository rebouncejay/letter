<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Brenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f6d3de;
    --blush-soft: #fdf1f5;
    --white: #ffffff;
    --rose-mid: #e896b4;
    --deep-rose: #c9587f;
    --deep-rose-2: #a8436a;
    --charcoal: #4a3540;
    --charcoal-soft: #75596a;
    --gold-hint: #d8b7a3;
    --bg-top: #f9e2ea;
    --bg-bottom: #eeb8cd;
    --cream: #f8ecd9;
    --sky-blue: #bcd8e8;
    --sky-blue-deep: #8fb8cf;
    --hot-pink: #e35c8d;
    --hot-pink-2: #d9467d;
    --hot-pink-soft: #f8dbe6;
    --wax-light: #f0d9a0;
    --wax-mid: #caa155;
    --wax-dark: #7c5a25;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: 'EB Garamond', serif;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 620px;
    position: relative;
  }

  /* ---------- LANDING (postcard) ---------- */
  .landing-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    overflow: hidden;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .landing-wrap.hidden {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    position: absolute;
    inset: 0;
  }

  /* ambient bokeh + petals behind the postcard */
  .ambient-bg {
    position: absolute;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
  }

  .bokeh {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.9), rgba(233,150,180,0.35) 55%, transparent 75%);
    animation: bokehFloat ease-in-out infinite;
  }

  .bokeh:nth-child(1) { width: 70px; height: 70px; top: 8%; left: 10%; animation-duration: 9s; }
  .bokeh:nth-child(2) { width: 34px; height: 34px; top: 14%; left: 78%; animation-duration: 7s; animation-delay: .6s; }
  .bokeh:nth-child(3) { width: 50px; height: 50px; top: 78%; left: 6%; animation-duration: 10s; animation-delay: 1.2s; }
  .bokeh:nth-child(4) { width: 26px; height: 26px; top: 82%; left: 86%; animation-duration: 6.5s; animation-delay: .3s; }
  .bokeh:nth-child(5) { width: 44px; height: 44px; top: 4%; left: 46%; animation-duration: 8s; animation-delay: 1.6s; }
  .bokeh:nth-child(6) { width: 20px; height: 20px; top: 90%; left: 45%; animation-duration: 7.5s; animation-delay: .9s; }

  @keyframes bokehFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
    50% { transform: translateY(-22px) scale(1.08); opacity: 0.85; }
  }

  .petal {
    position: absolute;
    top: -8%;
    width: 12px;
    height: 16px;
    background: var(--rose-mid);
    border-radius: 0 100% 0 100%;
    opacity: 0;
    animation: petalFall linear infinite;
  }

  .petal:nth-child(8) { left: 18%; animation-duration: 11s; animation-delay: 0s; }
  .petal:nth-child(9) { left: 40%; background: var(--deep-rose); animation-duration: 13s; animation-delay: 3s; }
  .petal:nth-child(10) { left: 64%; animation-duration: 12s; animation-delay: 6s; }
  .petal:nth-child(11) { left: 84%; background: var(--deep-rose); animation-duration: 10s; animation-delay: 1.5s; }

  @keyframes petalFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: 0.65; }
    90% { opacity: 0.5; }
    100% { transform: translateY(115%) translateX(24px) rotate(220deg); opacity: 0; }
  }

  /* ---------- POSTCARD ---------- */
  .postcard {
    position: relative;
    z-index: 1;
    width: min(520px, 92vw);
    aspect-ratio: 4 / 3;
    background: linear-gradient(155deg, var(--deep-rose) 0%, var(--deep-rose-2) 100%);
    border-radius: 10px;
    box-shadow: 0 25px 55px rgba(120, 40, 70, 0.35);
    overflow: hidden;
    padding: 40px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    cursor: default;
    transform-origin: center;
  }

  .postcard-vine {
    position: absolute;
    left: 0;
    right: 0;
    height: 54px;
    opacity: 0.9;
  }

  .postcard-vine.top { top: 0; }
  .postcard-vine.bottom { bottom: 0; transform: rotate(180deg); }

  /* corner flower clusters — gentle sway for ambiance */
  .corner-flowers {
    position: absolute;
    width: 58px;
    height: 58px;
    z-index: 1;
    pointer-events: none;
  }

  .corner-flowers.tl { top: 2px; left: 2px; }
  .corner-flowers.tr { top: 2px; right: 2px; transform: scaleX(-1); }
  .corner-flowers.bl { bottom: 2px; left: 2px; transform: scaleY(-1); }
  .corner-flowers.br { bottom: 2px; right: 2px; transform: scale(-1, -1); }

  .corner-flowers svg {
    width: 100%;
    height: 100%;
    display: block;
    transform-origin: 15% 15%;
    animation: cornerSway 6s ease-in-out infinite;
  }

  .corner-flowers.tl svg { animation-delay: 0s; }
  .corner-flowers.tr svg { animation-delay: 1.4s; }
  .corner-flowers.bl svg { animation-delay: 2.8s; }
  .corner-flowers.br svg { animation-delay: 4.2s; }

  @keyframes cornerSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3.5deg); }
  }

  .postcard-bouquet {
    width: 100px;
    flex-shrink: 0;
    animation: bouquetSway 5s ease-in-out infinite;
    transform-origin: bottom center;
    position: relative;
    z-index: 1;
  }

  @keyframes bouquetSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  /* corner floral accents */
  .corner-flower {
    position: absolute;
    width: 78px;
    z-index: 1;
    pointer-events: none;
  }

  .corner-flower.tl { top: 4px; left: 4px; transform-origin: top left; animation: swayTL 6s ease-in-out infinite; }
  .corner-flower.br { bottom: 4px; right: 4px; transform-origin: bottom right; animation: swayBR 6.5s ease-in-out infinite; animation-delay: .4s; }
  .corner-flower.tr { top: 4px; right: 4px; transform-origin: top right; animation: swayTR 7s ease-in-out infinite; animation-delay: .8s; }
  .corner-flower.bl { bottom: 4px; left: 4px; transform-origin: bottom left; animation: swayBL 6.2s ease-in-out infinite; animation-delay: .2s; }

  @keyframes swayTL { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes swayBR { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(-2deg); } }
  @keyframes swayTR { 0%, 100% { transform: rotate(1.5deg) translateY(0); } 50% { transform: rotate(-1.5deg) translateY(2px); } }
  @keyframes swayBL { 0%, 100% { transform: rotate(-1.5deg) translateY(0); } 50% { transform: rotate(1.5deg) translateY(-2px); } }

  @media (max-width: 560px) {
    .corner-flower { display: none; }
  }

  .postcard-text {
    text-align: right;
    position: relative;
    z-index: 1;
  }

  .postcard-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--cream);
    margin-bottom: 10px;
  }

  .postcard-quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 25px;
    line-height: 1.35;
    color: var(--white);
  }

  .postcard-stamp {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-light) 0%, var(--wax-mid) 48%, var(--wax-dark) 85%, #6b4c1f 100%);
    border: 1px solid rgba(107, 76, 31, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a3210;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 3px 7px rgba(70,40,10,0.4), inset 0 -3px 4px rgba(60,35,10,0.35), inset 0 2px 4px rgba(255,235,180,0.5);
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- STAGE SWAP: envelope shown first, postcard revealed after ---------- */
  .stage-swap {
    position: relative;
    width: 100%;
    min-height: 58vh;
  }

  .envelope-slot,
  .postcard-slot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }

  .envelope-slot.faded {
    opacity: 0;
    pointer-events: none;
  }

  .postcard-slot {
    opacity: 0;
    pointer-events: none;
  }

  .postcard-slot.revealed {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- ENVELOPE (real envelope, opens first) ---------- */
  .envelope2 {
    position: relative;
    width: 300px;
    height: 200px;
    cursor: pointer;
    filter: drop-shadow(0 18px 30px rgba(150, 70, 100, 0.28));
  }

  .envelope2-body {
    position: absolute;
    inset: 0;
    background: var(--hot-pink);
    border: 1px solid var(--hot-pink-2);
    border-radius: 4px;
    overflow: hidden;
  }

  .envelope2-body svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .envelope2-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 110px solid var(--hot-pink);
    transform-origin: top;
    transition: transform 0.6s cubic-bezier(.6,.1,.3,1);
    z-index: 3;
  }

  .envelope2.open .envelope2-flap {
    transform: rotateX(180deg);
  }

  .envelope2-shadow-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 110px solid rgba(0, 0, 0, 0.14);
    opacity: 0.3;
    z-index: 1;
  }

  .envelope2-letter-peek {
    position: absolute;
    bottom: 6px;
    left: 8px;
    right: 8px;
    height: 62%;
    background: var(--blush-soft);
    border: 3px double var(--hot-pink);
    border-radius: 3px;
    z-index: 2;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.06);
  }

  .envelope2-letter-peek::before,
  .envelope2-letter-peek::after {
    content: "♥";
    position: absolute;
    font-size: 9px;
    color: var(--hot-pink);
    opacity: 0.7;
  }

  .envelope2-letter-peek::before { top: 3px; left: 6px; }
  .envelope2-letter-peek::after { bottom: 3px; right: 6px; }

  .envelope2-label {
    position: absolute;
    inset: 4px;
    pointer-events: none;
  }

  .envelope2-label span {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.25;
    color: var(--hot-pink-2);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  .envelope2-label .label-top {
    top: 10px;
    left: 10px;
    text-align: left;
  }

  .envelope2-label .label-bottom {
    bottom: 10px;
    right: 10px;
    text-align: right;
  }

  @media (max-width: 560px) {
    .envelope2-label span { font-size: 11px; }
  }

  .envelope2-bow {
    position: absolute;
    top: 84px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 92px;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 3px 6px rgba(150, 40, 90, 0.3));
    transition: opacity 0.3s ease;
  }

  .envelope2.open .envelope2-bow {
    opacity: 0;
  }

  .envelope2-seal {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-light) 0%, var(--wax-mid) 48%, var(--wax-dark) 85%, #6b4c1f 100%);
    border: 1px solid rgba(107, 76, 31, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a3210;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    z-index: 5;
    box-shadow:
      0 4px 10px rgba(70, 40, 10, 0.45),
      inset 0 -4px 6px rgba(60, 35, 10, 0.35),
      inset 0 3px 5px rgba(255, 235, 180, 0.5);
    text-shadow: 0 1px 0 rgba(255, 235, 180, 0.4);
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  .envelope2.open .envelope2-seal {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }

  .tucked-photo {
    position: absolute;
    bottom: 14px;
    right: 14px;
    left: auto;
    transform: rotate(6deg);
    width: 60px;
    background: var(--white);
    padding: 4px 4px 12px;
    border-radius: 2px;
    box-shadow: 0 10px 20px rgba(90, 60, 70, 0.25);
    z-index: 1;
    transition: opacity 0.3s ease;
  }

  .envelope2.open .tucked-photo {
    opacity: 0;
  }

  .tucked-photo img {
    display: block;
    width: 100%;
    height: 48px;
    object-fit: cover;
    object-position: center 30%;
  }

  @media (max-width: 560px) {
    .envelope2 { width: 250px; height: 170px; }
    .envelope2-flap, .envelope2-shadow-flap { border-left-width: 125px; border-right-width: 125px; border-top-width: 92px; }
    .tucked-photo { width: 50px; }
    .tucked-photo img { height: 40px; }
  }

  .postcard-photo {
    bottom: 50px;
    left: 20px;
    right: auto;
    transform: rotate(-5deg);
    width: 116px;
    z-index: 2;
  }

  .postcard-photo img {
    height: 96px;
    transform: scaleX(-1);
  }

  @media (max-width: 560px) {
    .postcard-photo { bottom: auto; top: 10px; left: 10px; width: 82px; }
    .postcard-photo img { height: 68px; }
  }

  .tap-hint {
    margin-top: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--charcoal-soft);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* crumple animation — postcard scrunches up and fades after being revealed */
  .postcard.crumbling {
    animation: crumble 0.7s cubic-bezier(.5,0,.7,1) forwards;
  }

  @keyframes crumble {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; border-radius: 10px; }
    25%  { transform: scale(0.85) rotate(-4deg); border-radius: 20px; }
    50%  { transform: scale(0.55) rotate(6deg); border-radius: 40%; }
    75%  { transform: scale(0.28) rotate(-10deg); border-radius: 50%; opacity: 0.9; }
    100% { transform: scale(0.12) rotate(14deg); border-radius: 50%; opacity: 0; }
  }

  @media (max-width: 560px) {
    .postcard { flex-direction: column; text-align: center; padding: 34px 20px; justify-content: center; gap: 10px; }
    .postcard-text { text-align: center; }
    .postcard-bouquet { width: 84px; }
    .postcard-quote { font-size: 21px; }
  }

  /* ---------- LETTER PAGES ---------- */
  .page {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
    position: relative;
  }

  .page.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .page.leaving {
    opacity: 0;
    transform: translateY(-18px);
  }

  .letter-card {
    background: var(--white);
    border-radius: 6px;
    padding: 56px 48px 48px;
    box-shadow: 0 30px 60px rgba(90, 60, 70, 0.16);
    border: 1px solid var(--blush);
    position: relative;
  }

  .letter-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--rose-mid), var(--blush), var(--deep-rose));
    border-radius: 6px 6px 0 0;
  }

  .letter-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--deep-rose);
    margin-bottom: 28px;
  }

  .letter-body {
    font-size: 19px;
    line-height: 1.85;
    color: var(--charcoal);
    white-space: pre-wrap;
  }

  .letter-body .line {
    opacity: 0;
    display: block;
    animation: fadeInLine 1s ease forwards;
  }

  @keyframes fadeInLine {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .letter-signoff {
    margin-top: 36px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--charcoal-soft);
    opacity: 0;
    animation: fadeInLine 1s ease forwards;
  }

  .continue-prompt {
    display: block;
    margin: 40px auto 0;
    background: none;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--deep-rose);
    cursor: pointer;
    opacity: 0;
    animation: fadeInLine 1s ease forwards;
    text-align: center;
    letter-spacing: 0.02em;
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .continue-prompt:hover {
    transform: translateY(2px);
    color: var(--charcoal);
  }

  .continue-prompt .arrow {
    display: inline-block;
    margin-left: 6px;
    transition: transform 0.25s ease;
  }

  .continue-prompt:hover .arrow {
    transform: translateX(4px);
  }

  .back-prompt {
    margin: 0 0 22px;
    animation-delay: 0.1s !important;
  }

  .back-arrow {
    margin-left: 0;
    margin-right: 6px;
    transition: transform 0.25s ease;
  }

  .back-prompt:hover .back-arrow {
    transform: translateX(-4px);
  }

  .finish-prompt {
    display: block;
    margin: 34px auto 0;
    padding: 12px 34px;
    background: var(--deep-rose);
    color: var(--white);
    border-radius: 999px;
    font-style: normal;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    box-shadow: 0 10px 24px rgba(120, 40, 70, 0.3);
  }

  .finish-prompt:hover {
    background: var(--deep-rose-2);
    color: var(--white);
    transform: translateY(-2px);
  }

  .finish-prompt .arrow {
    display: none;
  }

  /* ---------- CLOSING SWEEP ---------- */
  .closing-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, var(--deep-rose) 0%, var(--deep-rose-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }

  .closing-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .closing-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(42px, 12vw, 120px);
    color: var(--white);
    text-shadow: 0 10px 34px rgba(80, 20, 45, 0.45);
    white-space: nowrap;
    transform: translateX(-130%);
  }

  .closing-overlay.visible .closing-text {
    animation: sweepAcross 1.3s cubic-bezier(.2,.8,.25,1) forwards;
  }

  @keyframes sweepAcross {
    0%   { transform: translateX(-130%); }
    65%  { transform: translateX(4%); }
    100% { transform: translateX(0); }
  }

  .sincere-video {
    display: block;
    width: 100%;
    border-radius: 6px;
    margin-top: 28px;
    box-shadow: 0 14px 30px rgba(90, 60, 70, 0.2);
    background: var(--charcoal);
  }

  /* ---------- FLOATING POLAROIDS ---------- */
  .polaroids {
    position: absolute;
    inset: -70px -150px;
    pointer-events: none;
    z-index: -1;
  }

  .polaroid {
    position: absolute;
    background: var(--white);
    padding: 10px 10px 34px;
    border-radius: 3px;
    box-shadow: 0 14px 26px rgba(90, 60, 70, 0.22);
    width: 150px;
    opacity: 0;
    animation: polaroidIn 1.1s cubic-bezier(.2,.9,.3,1.15) forwards, floatDrift 6s ease-in-out infinite;
    pointer-events: auto;
  }

  .polaroid img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--blush), var(--rose-mid));
    border-radius: 1px;
  }

  .polaroid-caption {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--charcoal-soft);
  }

  @keyframes polaroidIn {
    0%   { opacity: 0; transform: translateY(-42px) scale(0.85) rotate(calc(var(--rot) * 1.8)); }
    55%  { opacity: 1; transform: translateY(8px) scale(1.03) rotate(calc(var(--rot) - 1.5deg)); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }
  }

  @keyframes floatDrift {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-10px) rotate(calc(var(--rot) - 1.5deg)); }
  }

  .polaroid:nth-child(1) { --rot: -8deg; top: 1%;  left: -120px; animation-delay: 3.2s, 3.2s; }
  .polaroid:nth-child(2) { --rot: 6deg;  top: 13%; right: -140px; animation-delay: 3.6s, 3.6s; width: 132px; }
  .polaroid:nth-child(3) { --rot: 5deg;  top: 27%; left: -150px; animation-delay: 4.0s, 4.0s; width: 128px; }
  .polaroid:nth-child(4) { --rot: -6deg; top: 41%; right: -130px; animation-delay: 4.4s, 4.4s; width: 124px; }
  .polaroid:nth-child(5) { --rot: 4deg;  top: 55%; left: -140px; animation-delay: 4.8s, 4.8s; width: 130px; }
  .polaroid:nth-child(6) { --rot: -5deg; top: 68%; right: -145px; animation-delay: 5.2s, 5.2s; width: 126px; }
  .polaroid:nth-child(7) { --rot: 7deg;  top: 81%; left: -125px; animation-delay: 5.6s, 5.6s; width: 130px; }
  .polaroid:nth-child(8) { --rot: -7deg; top: 94%; right: -120px; animation-delay: 6.0s, 6.0s; width: 122px; }

  @media (max-width: 900px) {
    .polaroids { display: none; }
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--white);
    border: 1px solid var(--blush);
    box-shadow: 0 8px 20px rgba(90, 60, 70, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 20;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .music-toggle.shown {
    opacity: 1;
    transform: scale(1);
  }

  .music-toggle .bar {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }

  .music-toggle .bar span {
    width: 3px;
    background: var(--deep-rose);
    border-radius: 2px;
    animation: barBounce 0.9s ease-in-out infinite;
  }

  .music-toggle .bar span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .music-toggle .bar span:nth-child(2) { height: 100%; animation-delay: .15s; }
  .music-toggle .bar span:nth-child(3) { height: 65%; animation-delay: .3s; }

  .music-toggle.paused .bar span {
    animation-play-state: paused;
    height: 30% !important;
  }

  @keyframes barBounce {
    0%, 100% { height: 30%; }
    50% { height: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .letter-body .line, .letter-signoff, .polaroid, .continue-prompt {
      animation: none;
      opacity: 1;
    }
    .page {
      transition: none;
    }
    .bokeh, .petal, .postcard-bouquet, .music-toggle .bar span, .corner-flowers svg {
      animation: none;
      opacity: 0.4;
    }
    .postcard.crumbling {
      animation: none;
      opacity: 0;
    }
    .envelope2-flap, .envelope2-seal, .envelope-slot, .postcard-slot {
      transition: none;
    }
    .closing-overlay.visible .closing-text {
      animation: none;
      transform: translateX(0);
    }
  }

  @media (max-width: 480px) {
    .letter-card { padding: 40px 26px 34px; }
    .letter-heading { font-size: 25px; }
    .letter-body { font-size: 17px; }
  }
</style>

      <video id="sincereVideo" class="sincere-video" src="video/Video.mp4" playsinline controls></video>
      <div class="letter-heading" style="margin-top: 28px;">Still yours,</div>
      <p class="letter-signoff" id="signoff2" style="animation-delay: 0.2s;">— with all my love, Senior</p>
      <button class="continue-prompt finish-prompt" id="finishBtn" type="button" style="animation-delay: 0.8s;">finish</button>
    </div>
  </div>

  <!-- CLOSING: full-screen "I'm sorry" sweep, triggered by video ending or the Finish button -->
  <div class="closing-overlay" id="closingOverlay" aria-hidden="true">
    <div class="closing-text">I'm sorry</div>
  </div>


</div>

<!--
  Background music: audio/Brent Faiyaz - butterflies. Official Video.mp3
  Now starts automatically the moment the postcard is tapped (counts as a user
  gesture, so browsers allow it). The bottom-right button still lets Brenda
  pause/resume it manually afterward.
  Note: since this is a copyrighted track, keep this project private rather than
  publishing it to a public GitHub repo or public site — that would count as
  distributing the song publicly, not just using it for this one-off page.
-->
<audio id="bgAudio" src="audio/Brent%20Faiyaz%20-%20butterflies.%20Official%20Video.mp3" loop preload="none"></audio>
<button class="music-toggle paused" id="musicToggle" type="button" aria-label="Play music">
  <span class="bar"><span></span><span></span><span></span></span>

</button>

<script>
  const envelope2 = document.getElementById('envelope2');
  const envelopeSlot = document.getElementById('envelopeSlot');
  const postcard = document.getElementById('postcard');
  const postcardSlot = document.getElementById('postcardSlot');
  const landingWrap = document.getElementById('landingWrap');
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const letterBody = document.getElementById('letterBody');
  const continueBtn = document.getElementById('continueBtn');
  const backBtn = document.getElementById('backBtn');
  const finishBtn = document.getElementById('finishBtn');
  const closingOverlay = document.getElementById('closingOverlay');
  const musicToggle = document.getElementById('musicToggle');
  const bgAudio = document.getElementById('bgAudio');
  const sincereVideo = document.getElementById('sincereVideo');

  bgAudio.volume = 0.4; // 0 (silent) to 1 (full volume) — adjust as you like

  // The real letter.
  const letterLines = [
    'Hi Niki I’ve written this letter enough times now to know, there is no perfect apology to send. Sitting here writing and rewriting, erasing and deleting.',
    'It’s really dawned on me how much you truly mean to me, I know I’ve vocalized this enough, but at times I’ve failed to show you just how much you actually mean to me. Baby I hate that times I feed into your fears, some bigger than others, but they were never my intentions to make you feel that way.',
    'I’m just elusive in my emotions and genuinely speaking I wish you could see yourself through my eyes. Then you’d actually see why I literally can’t find words to explain the things I feel and how I see you.',
    'From the little giggles to the little crashouts on the minor inconveniences in your life, the smallest things about you really remind me how much I do love you. I really do mean it when I say I see forever in you.',
    'We’ve had our rocky moments in our relationship, some bigger than others, but one thing about the power couple is we find a way to go through it all, together.',
    'With everything that comes against us you showed me strength, you showed me understanding and most of all you ALWAYS listened to me. I love the smallest things paying attention and just learning how to love the loml and actually doing it never gets tiring for me, coz I know I’m fighting for real and I’d rather die trying, than live knowing there’s more I could’ve done.',
    'This comes as an apology letter, I’m trying my best to make things better, slowly by slowly I need your patience with me.',
    'Take this as a starting point darling.',
    'I’ve really kinda pushed away of late and I’m sorry for that, you’ve not gotten reassurance of late and I’m sorry for that, you’ve felt all kind of emotions coz of me and I’m sorry for that. All through all the shitty things that’s been going on with you coz of Me, I apologize.',
    'I truly do love you and always will, you’re the greatest girlfriend I could ever ask for and if I were to go through life whether good or bad there’s no one else I’d rather spend that time with. Brenda, you’re all I could ask for and more, I promise you, I’ll give you all that I’m capable of, tangible or intangible, if it means making you happy.',
    'I love all the little imperfections about everything and they are like butterfly wings when I look at you. You may not see them yourself but I’ll always cherish everything about you.',
    'This letter is already too long to restart one more time I really hope it was as heartfelt as I meant it to be, it’s very hard for me to find the words really to truly take you through the roller coaster of emotions I’m on right now.',
    'I really did make a terrible mistake, one I find even hard to forgive myself for doing, I can only imagine how hard it is for you.',
    'What happened that night really wasn’t me and I acted out of body, it comes easy for me to say but to remind that the real me is the junior you spent every one of the last couple of months is genuinely me.',
    'I am really sorry my love, I’m going to do more but for now this is what I was working on, hope what other thing I’m getting on with, you get to see.',
    'I really do love you and want us to give this the chance it deserves, I made a mistake and I’m ready to work and earn my forgiveness. If not forgiveness coz I know that’s hard to give right now, but a mere chance of “power couple” to live.'
  ];

  function typeInLetter() {
    letterBody.innerHTML = '';
    letterLines.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'line';
      span.textContent = text;
      span.style.animationDelay = (i * 0.55) + 's';
      span.style.marginBottom = '18px';
      letterBody.appendChild(span);
    });
    const continueDelay = (letterLines.length * 0.55) + 0.4;
    continueBtn.style.animationDelay = continueDelay + 's';

    const polaroids = document.querySelectorAll('.polaroid');
    const baseDelay = continueDelay + 0.6;
    polaroids.forEach((p, i) => {
      const inDelay = baseDelay + i * 0.35;
      p.style.animationDelay = inDelay + 's, ' + inDelay + 's';
    });
  }

  function openEnvelope() {
    envelope2.classList.add('open');

    // Start music immediately, inside the click handler, so the browser
    // counts it as triggered by a real user gesture and allows autoplay.
    bgAudio.play().then(() => {
      musicToggle.classList.remove('paused');
      musicToggle.setAttribute('aria-label', 'Pause music');
    }).catch(() => {
      // Autoplay blocked or file not found — toggle stays paused, user can tap it manually.
    });

    // Flap finishes opening (~0.6s) — fade the envelope out, reveal the postcard.
    setTimeout(() => {
      envelopeSlot.classList.add('faded');
      postcardSlot.classList.add('revealed');
    }, 650);

    // Let her see the postcard for a moment, then it crumples away.
    setTimeout(() => {
      postcard.classList.add('crumbling');
    }, 650 + 2100);

    // Crumple finishes — swap to the letter.
    setTimeout(() => {
      landingWrap.classList.add('hidden');
      typeInLetter();
      page1.classList.add('visible');
      musicToggle.classList.add('shown');
    }, 650 + 2100 + 700);
  }

  function goToPage2() {
    page1.classList.add('leaving');
    setTimeout(() => {
      page1.classList.remove('visible');
      page1.classList.remove('leaving');
      page2.classList.add('visible');
    }, 500);

    // Pause the music and play the video, triggered here (inside the click
    // handler) so it counts as a user gesture and autoplay is allowed.
    if (!bgAudio.paused) {
      bgAudio.pause();
      musicToggle.classList.add('paused');
      musicToggle.setAttribute('aria-label', 'Play music');
    }
    sincereVideo.currentTime = 0;
    sincereVideo.play().catch(() => {
      // Video missing/not ready yet — she can still hit play manually via the controls.
    });
  }

  function goToPage1() {
    page2.classList.add('leaving');
    setTimeout(() => {
      page2.classList.remove('visible');
      page2.classList.remove('leaving');
      page1.classList.add('visible');
    }, 500);

    // Stop the video and resume the music when heading back to the letter.
    sincereVideo.pause();
    bgAudio.play().then(() => {
      musicToggle.classList.remove('paused');
      musicToggle.setAttribute('aria-label', 'Pause music');
    }).catch(() => {});
  }

  // Show the closing "I'm sorry" sweep — pauses everything else first.
  function showClosing() {
    sincereVideo.pause();
    bgAudio.pause();
    musicToggle.classList.add('paused');
    musicToggle.setAttribute('aria-label', 'Play music');
    closingOverlay.classList.add('visible');
  }

  // When the video finishes on its own, move straight to the closing sweep.
  sincereVideo.addEventListener('ended', showClosing);

  envelope2.addEventListener('click', openEnvelope);
  envelope2.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' || e.key === ' ') openEnvelope();
  });

  continueBtn.addEventListener('click', goToPage2);
  backBtn.addEventListener('click', goToPage1);
  finishBtn.addEventListener('click', showClosing);

  musicToggle.addEventListener('click', () => {
    if (bgAudio.paused) {
      bgAudio.play().catch(() => {
        // File missing/misnamed, or browser blocked it — fail quietly.
      });
      musicToggle.classList.remove('paused');
      musicToggle.setAttribute('aria-label', 'Pause music');
    } else {
      bgAudio.pause();
      musicToggle.classList.add('paused');
      musicToggle.setAttribute('aria-label', 'Play music');
    }
  });
</script>

</body>
</html>
